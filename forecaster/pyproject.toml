[project]
name = "forecaster"
version = "0.1.0"
description = "Metro-level housing market forecaster (Zillow ZHVI + macro data)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "polars>=1.0",
    "pandas>=2.2",          # required by statsforecast / lightgbm interop
    "numpy>=1.26",
    "pyarrow>=16.0",
    "httpx>=0.27",
    "fredapi>=0.5",
    "statsforecast>=2.0",
    "lightgbm>=4.3",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.scripts]
forecaster = "forecaster.cli:app"

[tool.poetry]
packages = [{ include = "forecaster", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.6"
mypy = ">=1.10"
pandas-stubs = ">=2.2"

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Untyped third-party libraries; their call sites are isolated in models/ and ingest/.
module = ["statsforecast.*", "lightgbm.*", "fredapi.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
